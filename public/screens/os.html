<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440,initial-scale=1"/>
<title>bricks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  @font-face { font-family:'General Sans'; src:url('https://fonts.cdnfonts.com/s/85755/GeneralSans-Regular.woff2') format('woff2'); font-weight:400; }
  @font-face { font-family:'General Sans'; src:url('https://fonts.cdnfonts.com/s/85755/GeneralSans-Medium.woff2') format('woff2'); font-weight:500; }
  @font-face { font-family:'General Sans'; src:url('https://fonts.cdnfonts.com/s/85755/GeneralSans-Semibold.woff2') format('woff2'); font-weight:600; }
  html,body { margin:0; padding:0; overflow:hidden; background:#E4DED2; font-family:'General Sans',ui-sans-serif,sans-serif; }
  html[data-theme="dark"], html[data-theme="dark"] body { background:#141210; }
  html[data-theme="light"], html[data-theme="light"] body { background:#E4DED2; }
  #root { display:block; width:1440px; height:920px; overflow:hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="bricks.compiled.js"></script>
<script>
(function(){
  var ALLOWED = {
    overview:1, crm:1, transactions:1, mls:1, forms:1, jobs:1,
    jobdetail:1, vendors:1, accounting:1, billing:1, agents:1, settings:1
  };
  function screenParam(){
    try{
      var q = new URLSearchParams(location.search).get('screen');
      if (q && ALLOWED[q]) return q;
    }catch(e){}
    return 'overview';
  }
  function lockParam(){
    try{
      var q = new URLSearchParams(location.search).get('lock');
      if (q === '1' || q === 'true') return true;
    }catch(e){}
    return false;
  }
  function parentTheme(){
    try{
      var t=window.parent.document.documentElement.getAttribute('data-theme');
      if(t==='dark'||t==='light') return t;
      return window.parent.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    }catch(e){
      return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    }
  }
  function apply(theme){
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
    document.body.style.background = theme==='dark' ? '#141210' : '#E4DED2';
  }
  var dark=parentTheme()==='dark';
  var screen=screenParam();
  var locked=lockParam();
  apply(dark?'dark':'light');
  var root=ReactDOM.createRoot(document.getElementById('root'));
  function render(){
    root.render(React.createElement(DemoOS, {dark: dark, screen: screen, locked: locked}));
  }
  window.addEventListener('message', function(e){
    if(e.data && e.data.bricks_theme){
      dark = e.data.bricks_theme==='dark';
      apply(dark?'dark':'light');
      render();
    }
  });
  render();

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    if (screen === 'overview') {
      // KPI count only ever climbs, then settles -- never ticks back down.
      var counts = ['184','185','186','187','188','189','190'];
      var ci = 0;
      var counter = setInterval(function(){
        ci++;
        if (ci >= counts.length) { clearInterval(counter); return; }
        var from = counts[ci - 1], to = counts[ci];
        var rootEl = document.getElementById('root');
        if (!rootEl) return;
        var walk = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT);
        var n;
        while ((n = walk.nextNode())) {
          if (n.nodeValue && n.nodeValue.indexOf(from) !== -1) {
            n.nodeValue = n.nodeValue.split(from).join(to);
          }
        }
      }, 2500);
    }
    // Transactions growth lives in TransactionsContent (bricks.js) so the
    // register and the open-deal totals move on the same event.
  }
})();
</script>
</body>
</html>
