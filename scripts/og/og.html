<!doctype html>
<!-- Source for public/og.png (1200x630 link preview). Render: python3 scripts/og/render.py -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../public/fonts/fonts.css">
<style>
@font-face{font-family:'General Sans';src:url('../../public/fonts/GeneralSans-Regular.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'General Sans';src:url('../../public/fonts/GeneralSans-Medium.woff2') format('woff2');font-weight:500;}
@font-face{font-family:'JetBrains Mono';src:url('../../public/fonts/JetBrainsMono-Regular.woff2') format('woff2');font-weight:400;}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#F4F1EB;color:#14110E;font-family:'General Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;position:relative}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
/* Exact nav lockup (BrandMark + .wordmark) at 3x: svg 20->60, gap 8->24, 18px/-0.6px -> 54px/-1.8px */
.brand{display:inline-flex;align-items:center;gap:24px}
.brand svg{width:60px;height:60px;display:block}
.wordmark{font-weight:500;font-size:54px;letter-spacing:-1.8px;line-height:1}
.head{margin-top:auto;font-weight:500;font-size:84px;line-height:1.04;letter-spacing:-.03em;max-width:980px}
.sub{margin-top:28px;font-weight:400;font-size:30px;line-height:1.3;letter-spacing:-.01em;color:#6B6054}
.foot{position:absolute;right:80px;top:84px;font-family:'JetBrains Mono',monospace;font-size:22px;color:#6B6054}
</style></head>
<body><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="4" width="11" height="6.4" rx="0.8" fill="#D2542B" opacity="0.82" />
      <rect x="3" y="11.6" width="6" height="8.4" rx="0.8" fill="#D2542B" />
      <rect x="10.2" y="11.6" width="10.8" height="8.4" rx="0.8" fill="#D2542B" />
    </svg>
    <span class="wordmark">bricks</span>
  </div>
  <div class="head">The system for<br>Canadian real estate</div>
  <div class="sub">Listing media, deals, e-sign and CRM in one place.</div>
</div>
<div class="foot">brxs.ca</div>

</body></html>
